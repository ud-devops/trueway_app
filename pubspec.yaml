name: trueway_farms
description: Trueway Farms - organic e-commerce (reconstructed from shipped APK).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # state / routing
  flutter_riverpod: ^2.6.1
  go_router: ^17.3.0

  # networking
  dio: ^5.11.0

  # ui / media
  google_fonts: ^8.2.0
  cached_network_image: ^3.4.1
  flutter_widget_from_html_core: ^0.17.2
  confetti: ^0.8.0
  webview_flutter: ^4.14.1
  # Both were already resolving transitively; they are declared only so the
  # platform-specific controllers can be imported. Video needs them:
  # Android blocks JS-initiated playback unless
  # `setMediaPlaybackRequiresUserGesture(false)`, and iOS plays every clip in a
  # native fullscreen player unless `allowsInlineMediaPlayback` is set. Without
  # these two the embedded player simply never starts.
  webview_flutter_android: ^4.12.0
  webview_flutter_wkwebview: ^3.25.1

  # payments
  # Razorpay Standard Checkout. Reached only through
  # `lib/core/payments/payment_gateway.dart` — nothing else in lib/ imports it.
  razorpay_flutter: ^1.4.5

  # device / storage
  shared_preferences: ^2.5.5
  share_plus: ^13.3.0
  # Return evidence. `POST /order-returns` cannot accept files — it reads
  # `media_images` with `$request->input()`, so attached files are silently
  # dropped — everything must go through `/order-returns/upload-media` first,
  # which needs real file paths off the device.
  image_picker: ^1.2.0
  # The Account menu's help pages (About us, Contact us, Shipping & delivery,
  # Cancellation & returns, FAQ) open in the device browser rather than the
  # in-app WebView, so the customer gets a real address bar, their own
  # bookmarks and their own back stack.
  url_launcher: ^6.3.2

  # utils
  intl: ^0.20.3
  material_symbols_icons: ^4.2960.0
  path_provider: ^2.1.6
  open_filex: ^4.7.0

# ── Deliberately NOT declared ─────────────────────────────────────────────
# These were carried over from the original stack but nothing in lib/ imports
# them. They are not free: `sqflite` and `video_player` both require Dart
# >=3.12, so declaring them made `flutter pub get` fail outright on any older
# toolchain, and the native plugins inflated the release APK.
#
# Re-add ONLY when the matching feature is actually implemented:
#   (razorpay_flutter is now declared above — payments are being wired.)
#   video_player            -> product videos (Product.videos)
#   youtube_player_flutter  -> product videos (YouTube-hosted)
#   sqflite / path_provider -> local DB, if SharedPreferences stops being enough
#   fluttertoast            -> not needed; use SnackBar
#   uuid / crypto / rxdart / logging -> unused utilities

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
